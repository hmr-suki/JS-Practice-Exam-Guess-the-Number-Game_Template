<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link href="style.css" rel="stylesheet" type="text/css" />


    <title>JS5 - Pizza Palace</title>
  </head>


  <body>
    <div class="wrapper">
      <h1 class="heading">Raider Pizza Palace</h1>
      <div class="grid">
        <div class="menu">
          <h3>Menu</h3>
          <p>$10 Small</p>
          <p>$12 Medium</p>
          <p>$14 Large</p>
          <p>$1.50 / Topping</p>
          <img
            class="pizzaImg"
            src="pizza.jpg"
            height="80px"
            alt="pic of pizza"
          />
        </div>
        <div class="right">
          <h3>Order Here:</h3>
          <form class="orderform" name="orderform">
            <div class="field">
              Name: <input type="text" class="name" name="" value="" />
            </div>


            <div class="field">
              # of Pizzas:
              <!--number input -->
              <input type ="number" class = "pizzaNum"/>
            </div>
            <div class="field">
              <!--three radio buttons-->
              Size:
              <input type = "radio" name = "size" class = "smallRadio"/>Small
              <input type = "radio" name = "size" class ="mediumRadio"/>Medium
              <input type = "radio" name = "size" class ="largeRadio"/>Large


            </div>
            <hr />


            <h4>Toppings</h4>
            <!-- add a topping here -->
             Cheese <input type ="checkbox" value = "cheese" class ="topping"/>
            <br />
            <!-- add a topping here -->
             Pepperoni <input type ="checkbox" value = "pepperoni" class="topping"/>
            <br />
            <!-- add a topping here -->
             Onions <input type ="checkbox" value = "onions" class = "topping"/>
            <br />
            <!-- add a topping here -->
             Bacon <input type ="checkbox" value = "bacon" class = "topping"/>
            <br />
            <!-- add a topping here -->
             Spinach <input type ="checkbox" value = "spinach" class = "topping"/>
            <br />


            <br />
            <hr />
            <div style="margin: 0 auto">
              <!--add order button here -->
              <button type = "button" class = "orderButton">Order Total</button>


              <!--add reset button here -->
              <button type ="reset" class = "resetButton">Reset</button>
            </div>
          </form>
        </div>
      </div>
      <div class="details">
        <h3 style="margin: 0 auto">Your Order Details</h3>
        <div class="details-field">
          Subtotal
          <input type="text" class="subtotal" name="" value="0" readonly />
        </div>
        <div class="details-field">
          Tax: <input type="text" class="tax" name="" value="0" readonly />
        </div>
        <div class="details-field">
          Total: <input type="text" class="total" name="" value="0" readonly />
        </div>
      </div>
    </div>


    <script src="script.js"></script>
  </body>
</html>
